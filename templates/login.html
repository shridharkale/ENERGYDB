<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnergyFlow — Sign In</title>
    <meta name="description" content="Login to the Campus Energy Consumption Management System">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card-bg: #13131f;
            --card-glass: rgba(19, 19, 31, 0.75);
            --primary: #ffffff;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --accent-soft: rgba(99, 102, 241, 0.1);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border: rgba(255,255,255,0.06);
            --border-bright: rgba(99,102,241,0.3);
            --danger: #ef4444;
            --danger-soft: rgba(239,68,68,0.1);
            --radius: 16px;
            --shadow-xl: 0 24px 48px rgba(0,0,0,0.55), 0 0 60px rgba(99,102,241,0.12), 0 0 0 1px rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.10) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(16,185,129,0.06) 0%, transparent 50%),
                        var(--bg);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            visibility: hidden;
        }
        body.motion-ready { visibility: visible; }

        /* ── Canvas background ── */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Curtain overlay (shared language with the dashboard) ── */
        #curtain {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            pointer-events: none;
        }
        .blind {
            flex: 1;
            background: var(--bg);
            transform: scaleY(0);
            transform-origin: top;
            will-change: transform;
            position: relative;
            overflow: hidden;
        }

        /* ── Login layout ── */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }

        .login-card {
            background: var(--card-glass);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border-radius: 24px;
            border: 1px solid rgba(99,102,241,0.18);
            box-shadow: var(--shadow-xl);
            padding: 52px 44px 44px;
            position: relative;
            overflow: hidden;
            transform: perspective(1200px) rotateX(8deg) translateY(48px);
            opacity: 0;
            will-change: transform, opacity;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #10b981);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .login-card:hover::before { transform: scaleX(1); }

        /* ── Brand section ── */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 36px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 60%, #8b5cf6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 28px rgba(99,102,241,0.5), 0 0 48px rgba(99,102,241,0.25);
            will-change: transform;
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            stroke: white;
            stroke-width: 2.5;
            fill: none;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.03em;
            min-height: 38px;
        }
        .brand-title .char { display: inline-block; will-change: transform, opacity; }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: -6px;
            line-height: 1.5;
            min-height: 20px;
        }
        .brand-subtitle .char { display: inline-block; will-change: transform, opacity; }

        /* ── Form elements ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
            opacity: 0;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-main);
            font-size: 13px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            stroke-width: 2;
            fill: none;
            pointer-events: none;
            transition: stroke 0.2s;
        }

        .input-wrap input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            background: rgba(255,255,255,0.02);
            color: var(--text-main);
            transition: border-color 0.2s, background 0.2s;
        }

        .input-wrap input::placeholder { color: #475569; }

        .input-wrap input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.03);
        }

        .input-wrap:has(input:focus) svg {
            stroke: var(--accent);
        }

        /* ── Login button ── */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.01em;
            overflow: hidden;
            position: relative;
            will-change: transform, box-shadow;
            box-shadow: 0 4px 18px rgba(99,102,241,0.45);
            transition: background 0.2s;
            opacity: 0;
        }

        .btn-login:active { transform: translateY(0) !important; }

        .btn-login svg {
            width: 18px;
            height: 18px;
            stroke: white;
            stroke-width: 2.5;
            fill: none;
            flex-shrink: 0;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        .btn-login .btn-text { display: flex; align-items: center; gap: 8px; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Error box ── */
        .error-box {
            background: var(--danger-soft);
            border: 1px solid rgba(239,68,68,0.35);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fca5a5;
            font-size: 13px;
            font-weight: 500;
        }

        .error-box svg {
            width: 18px;
            height: 18px;
            stroke: var(--danger);
            stroke-width: 2;
            fill: none;
            flex-shrink: 0;
        }

        /* ── Footer ── */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            color: var(--text-muted);
            font-size: 12px;
            opacity: 0;
        }

        /* ── Floating orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        #orb-1 { background: rgba(99,102,241,0.09); }
        #orb-2 { background: rgba(16,185,129,0.06); }
        #orb-3 { background: rgba(139,92,246,0.07); }
        #orb-4 { background: rgba(99,102,241,0.05); }
        #orb-5 { background: rgba(16,185,129,0.05); }
        #orb-6 { background: rgba(139,92,246,0.06); }
    </style>
</head>
<body>

<!-- Animated dot-grid background -->
<canvas id="bg-canvas"></canvas>

<!-- Floating orbs -->
<div class="orb" id="orb-1" style="width:280px;height:280px;top:5%;left:10%;"></div>
<div class="orb" id="orb-2" style="width:200px;height:200px;top:50%;left:60%;"></div>
<div class="orb" id="orb-3" style="width:240px;height:240px;top:70%;left:5%;"></div>
<div class="orb" id="orb-4" style="width:160px;height:160px;top:15%;left:75%;"></div>
<div class="orb" id="orb-5" style="width:220px;height:220px;top:80%;left:70%;"></div>
<div class="orb" id="orb-6" style="width:180px;height:180px;top:35%;left:35%;"></div>

<!-- Curtain overlay -->
<div id="curtain"></div>

<div class="login-wrapper">
    <div class="login-card" id="login-card">
        <div class="brand">
            <div class="brand-icon" id="brand-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </div>
            <div class="brand-title" id="brand-title">EnergyFlow</div>
            <div class="brand-subtitle" id="brand-subtitle">Campus Energy Consumption Management System</div>
        </div>

        {% if error %}
        <div class="error-box" id="error-box">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" id="login-form">
            <div class="form-group" id="fg-email">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                        value="{{ email_value or '' }}"
                    >
                </div>
            </div>

            <div class="form-group" id="fg-password">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button type="submit" class="btn-login" id="login-btn">
                <span class="btn-text">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="btn-arrow">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Sign In
                </span>
                <svg class="spinner" id="btn-spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
                    <path stroke="white" stroke-width="3" stroke-linecap="round" d="M12 2a10 10 0 019.78 7.84"/>
                </svg>
            </button>
        </form>

        <div class="login-footer" id="login-footer">
            &copy; 2026 EnergyFlow Systems &nbsp;·&nbsp; Campus Infrastructure Management
        </div>
    </div>
</div>

<script type="module">
import * as anime from "https://cdn.jsdelivr.net/npm/animejs@4/+esm";

// v4 easing map — anime.easings.eases uses SHORT names (outExpo etc.)
const _e = anime.easings.eases || {};
const E = {
    easeInQuad:    _e.inQuad    || _e.linear,
    easeInExpo:    _e.inExpo    || _e.linear,
    easeOutQuad:   _e.outQuad   || _e.linear,
    easeOutCubic:  _e.outCubic  || _e.linear,
    easeOutQuart:  _e.outQuart  || _e.linear,
    easeOutExpo:   _e.outExpo   || _e.linear,
    easeOutBack:   _e.outBack   || _e.linear,
    easeOutElastic: _e.outElastic || _e.linear,
    easeOutBounce: _e.outBounce || _e.linear,
};

// ════════════════════════════════════════════════════════════
//  1. DOT-GRID CANVAS BACKGROUND + PARTICLE PULSE
// ════════════════════════════════════════════════════════════
(function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    const SPACING = 30;
    const DOT_R = 1.5;
    const DOT_COLOR = 'rgba(99,102,241,0.18)';
    let pulse = 1; // entrance pulse multiplier

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = DOT_COLOR;
        pulse += (1 - pulse) * 0.04; // ease back to 1
        for (let x = SPACING; x < canvas.width; x += SPACING) {
            for (let y = SPACING; y < canvas.height; y += SPACING) {
                ctx.beginPath();
                // subtle breathing: dots drift slightly + pulse on entrance
                const dx = (Math.random() - 0.5) * 1.4 * pulse;
                const dy = (Math.random() - 0.5) * 1.4 * pulse;
                ctx.arc(x + dx, y + dy, DOT_R * pulse, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    pulse = 2.4; // entrance pulse: dots "pop" then settle
})();

// ════════════════════════════════════════════════════════════
//  2. CURTAIN REVEAL (same language as dashboard)
// ════════════════════════════════════════════════════════════
const BLINDS = 10;
const curtain = document.getElementById('curtain');
(function buildBlinds() {
    for (let i = 0; i < BLINDS; i++) {
        const b = document.createElement('div');
        b.className = 'blind';
        curtain.appendChild(b);
    }
})();

function curtainReveal() {
    anime.set('.blind', { scaleY: 1 });
    anime.animate('.blind', {
        scaleY: [1, 0],
        duration: 620,
        ease: E.easeOutExpo,
        delay: anime.stagger(55),
        onComplete: () => { curtain.style.display = 'none'; }
    });
}

// ════════════════════════════════════════════════════════════
//  3. FLOATING ORBS (ambient loop)
// ════════════════════════════════════════════════════════════
const orbConfigs = [
    { id: '#orb-1', tx: [-30, 30],  ty: [-20, 20],  dur: 9000  },
    { id: '#orb-2', tx: [25, -25],  ty: [35, -35],  dur: 11000 },
    { id: '#orb-3', tx: [-40, 40],  ty: [-30, 10],  dur: 13000 },
    { id: '#orb-4', tx: [20, -20],  ty: [-40, 40],  dur: 10000 },
    { id: '#orb-5', tx: [-25, 25],  ty: [20, -40],  dur: 12000 },
    { id: '#orb-6', tx: [35, -35],  ty: [-15, 30],  dur: 8500  },
];

orbConfigs.forEach(cfg => {
    anime.animate(cfg.id, {
        x: cfg.tx,
        y: cfg.ty,
        duration: cfg.dur,
        ease: E.easeInOutSine,
        loop: true,
        direction: 'alternate',
    });
});

// ════════════════════════════════════════════════════════════
//  4. CARD ENTRY — cinematic 3D rise with spring overshoot
// ════════════════════════════════════════════════════════════
const card = document.getElementById('login-card');

// NOTE: timings are additive in the v4 timeline — each add() starts after
// the previous child's end, so durations are tuned for a smooth cascade.
// v4 note: createTimeline().add() throws async "s.pause is not a function",
// so the whole entrance is sequenced with a small helper + standalone animates.
function timeoutAt(ms, fn) { setTimeout(fn, ms); }

// 4a. Card rises with perspective rotation + elastic settle (starts at 120ms)
// v4 note: per-frame `keyframes` with easing fns throws "i.includes is not a function",
// so each beat is chained via onComplete.
setTimeout(() => {
    anime.set(card, { opacity: 1, y: 48, rotateX: 8 });
    anime.animate(card, {
        y: -14, rotateX: -2, duration: 680, ease: E.easeOutCubic,
        onComplete: () => setTimeout(() => anime.animate(card, {
            y: 6, rotateX: 1, duration: 340, ease: E.easeOutBack,
            onComplete: () => setTimeout(() => anime.animate(card, {
                y: 0, rotateX: 0, duration: 420, ease: E.easeOutElastic,
            }), 0),
        }), 0),
    });
}, 120);

// 4b. Brand icon — drop-in with elastic bounce (after card rises)
timeoutAt(920, () => {
    anime.animate('#brand-icon', {
        scale: [0, 1.14], rotate: [-12, 4],
        duration: 520, ease: E.easeOutElastic,
        onComplete: () => setTimeout(() => anime.animate('#brand-icon', {
            scale: [1.14, 1], rotate: [4, 0], duration: 360, ease: E.easeOutElastic,
        }), 0),
    });
});

// 4c. Brand title — anime.js v4 scrambleText (hacker decode)
setTimeout(() => {
    const titleEl = document.getElementById('brand-title');
    if (!titleEl) return;
    const current = titleEl.textContent;
    titleEl.textContent = '';   // scrambleText writes from empty → target
    anime.animate(titleEl, {
        innerHTML: anime.scrambleText({
            text: current,
            ease: E.easeOutExpo,
            revealRate: 55,
            settleDuration: 300,
            from: 'left',
            cursor: true,
        }),
        duration: 1000,
        ease: E.easeOutExpo,
    });
}, 500);

// 4d. Subtitle — character-by-character fade-up
setTimeout(() => {
    const subEl = document.getElementById('brand-subtitle');
    if (!subEl) return;
    // v4 splitText keeps the original text behind the char spans (duplication);
    // manual char-span reveal keeps full control
    const text = subEl.textContent;
    subEl.innerHTML = [...text].map(ch =>
        `<span style="display:inline-block;opacity:0;transform:translateY(12px)">${ch === ' ' ? '&nbsp;' : ch}</span>`
    ).join('');
    const chars = subEl.querySelectorAll('span');
    anime.animate(chars, {
        y: [12, 0],
        opacity: [0, 1],
        duration: 560,
        ease: E.easeOutQuart,
        delay: anime.stagger(18),
    });
}, 940);

// 4e. Error box (if present) — slide in with shake hint
const errorBox = document.getElementById('error-box');
if (errorBox) {
    anime.set(errorBox, { y: -16, opacity: 0 });
    timeoutAt(240, () => anime.animate(errorBox, {
        y: [-16, 0],
        opacity: [0, 1],
        duration: 480,
        ease: E.easeOutBack,
        onComplete: () => setTimeout(() => anime.animate(errorBox, {
            x: [0, -6, 6, -4, 4, 0],
            duration: 420,
        }), 0),
    }));
}

// 4f. Form fields — staggered slide-up with glow reveal
timeoutAt(1340, () => anime.animate('#fg-email, #fg-password', {
    y: [22, 0],
    opacity: [0, 1],
    duration: 620,
    ease: E.easeOutQuart,
    delay: anime.stagger(130),
}));

// 4g. Button — spring scale-in + glow after fields
timeoutAt(1740, () => {
    anime.animate('#login-btn', {
        opacity: [0, 1], scale: [0.6, 1.04], y: [10, -2],
        duration: 500, ease: E.easeOutBack,
        onComplete: () => setTimeout(() => anime.animate('#login-btn', {
            scale: [1.04, 1], y: [-2, 0], duration: 320, ease: E.easeOutElastic,
        }), 0),
    });
});

// 4h. Footer
timeoutAt(2560, () => anime.animate('#login-footer', {
    opacity: [0, 1],
    y: [10, 0],
    duration: 500,
    ease: E.easeOutQuart,
}));

// 4i. Brand icon ambient pulse (after entrance completes)
timeoutAt(3060, () => anime.animate('#brand-icon', {
    scale: [1, 1.08], duration: 1100, ease: E.easeInOutSine,
    onComplete: () => setTimeout(() => anime.animate('#brand-icon', {
        scale: [1.08, 1], duration: 1100, ease: E.easeInOutSine,
        onComplete: () => setTimeout(() => anime.animate('#brand-icon', {
            scale: [1, 1.08], duration: 1100, ease: E.easeInOutSine,
            loop: true,
        }), 0),
    }), 0),
}));

// ════════════════════════════════════════════════════════════
//  5. INPUT FOCUS GLOW
// ════════════════════════════════════════════════════════════
document.querySelectorAll('.input-wrap input').forEach(input => {
    input.addEventListener('focus', () => {
        anime.animate(input, {
            boxShadow: ['0 0 0 0px rgba(99,102,241,0)', '0 0 0 4px rgba(99,102,241,0.22)'],
            duration: 200,
            ease: E.easeOutQuad,
        });
    });
    input.addEventListener('blur', () => {
        anime.animate(input, {
            boxShadow: ['0 0 0 4px rgba(99,102,241,0.22)', '0 0 0 0px rgba(99,102,241,0)'],
            duration: 250,
            ease: E.easeOutQuad,
        });
    });
});

// ════════════════════════════════════════════════════════════
//  6. BUTTON HOVER / MAGNETIC LIFT
// ════════════════════════════════════════════════════════════
const btn = document.getElementById('login-btn');
btn.addEventListener('mouseenter', () => {
    if (btn.disabled) return;
    anime.animate(btn, {
        y: -3,
        boxShadow: '0 12px 34px rgba(99,102,241,0.62)',
        duration: 160,
        ease: E.easeOutQuad,
    });
});
btn.addEventListener('mouseleave', () => {
    if (btn.disabled) return;
    anime.animate(btn, {
        y: 0,
        boxShadow: '0 4px 18px rgba(99,102,241,0.45)',
        duration: 220,
        ease: E.easeOutQuad,
    });
});

// ════════════════════════════════════════════════════════════
//  7. SUBMIT → CURTAIN WIPE → LOADING STATE
// ════════════════════════════════════════════════════════════
document.getElementById('login-form').addEventListener('submit', function (e) {
    if (btn.disabled) return;
    btn.disabled = true;

    const btnText = btn.querySelector('.btn-text');
    const spinner = document.getElementById('btn-spinner');

    // Freeze width then shrink to spinner circle
    btn.style.width = btn.offsetWidth + 'px';

    anime.animate(btnText, {
        opacity: 0,
        duration: 140,
        ease: E.easeOutQuad,
        onComplete: () => { btnText.style.display = 'none'; }
    });

    anime.animate(btn, {
        width: 48,
        borderRadius: 24,
        duration: 360,
        ease: E.easeInOutQuart,
        delay: 100,
        onComplete: () => { spinner.style.display = 'block'; }
    });

    // Curtain wipe covers the screen while Flask processes the login
    curtain.style.display = 'flex';
    anime.set('.blind', { scaleY: 0 });
    anime.animate('.blind', {
        scaleY: [0, 1],
        duration: 420,
        ease: E.easeInExpo,
        delay: anime.stagger(28),
    });
});

// ════════════════════════════════════════════════════════════
//  8. BOOT
// ════════════════════════════════════════════════════════════
window.onload = () => {
    document.body.classList.add('motion-ready');
    curtainReveal();   // blinds retract — curtain reveal
    // entrance choreography is already running via the timeoutAt sequence above
};
</script>

</body>
</html>
